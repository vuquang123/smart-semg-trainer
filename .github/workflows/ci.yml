name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web App (Typecheck, Vitest, Build, WS AEAD)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run check

      - name: Run Vitest suite
        run: npm test

      - name: Build production bundle & PWA service worker
        run: npm run build

      - name: Verify WebSocket TinyJAMBU-128 AEAD roundtrip
        run: npm run test:ws

  firmware-native-c:
    name: Firmware Host Native C11 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firmware

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify GCC availability
        run: gcc --version

      - name: Build and run native C11 regression tests
        run: python3 tests/run_tests.py
